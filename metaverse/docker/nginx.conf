map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"service":"web",'
    '"requestId":"$request_id",'
    '"remoteAddr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$args",'
    '"status":$status,'
    '"bytesSent":$body_bytes_sent,'
    '"requestTime":$request_time,'
    '"upstreamTime":"$upstream_response_time",'
    '"referer":"$http_referer",'
    '"userAgent":"$http_user_agent"'
  '}';

server {
  listen 8080;
  listen 8081 proxy_protocol;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  access_log /dev/stdout json_access;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header proxy_protocol;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' ws: wss: blob:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"ok","service":"web"}';
  }

  location /api/ {
    proxy_pass http://http:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
  }

  location /socket {
    proxy_pass http://ws:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
